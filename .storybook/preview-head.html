<!-- Tailwind CSS CDN for dynamic runtime JSX styling in Live AI Canvas -->
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    darkMode: 'class',
    theme: {
      extend: {
        colors: {
          border: "hsl(var(--border))",
          input: "hsl(var(--input))",
          ring: "hsl(var(--ring))",
          background: "hsl(var(--background))",
          foreground: "hsl(var(--foreground))",
          primary: {
            DEFAULT: "hsl(var(--primary))",
            foreground: "hsl(var(--primary-foreground))",
          },
          secondary: {
            DEFAULT: "hsl(var(--secondary))",
            foreground: "hsl(var(--secondary-foreground))",
          },
          destructive: {
            DEFAULT: "hsl(var(--destructive))",
            foreground: "hsl(var(--destructive-foreground))",
          },
          muted: {
            DEFAULT: "hsl(var(--muted))",
            foreground: "hsl(var(--muted-foreground))",
          },
          accent: {
            DEFAULT: "hsl(var(--accent))",
            foreground: "hsl(var(--accent-foreground))",
          },
          popover: {
            DEFAULT: "hsl(var(--popover))",
            foreground: "hsl(var(--popover-foreground))",
          },
          card: {
            DEFAULT: "hsl(var(--card))",
            foreground: "hsl(var(--card-foreground))",
          },
          chart: {
            1: "hsl(var(--chart-1))",
            2: "hsl(var(--chart-2))",
            3: "hsl(var(--chart-3))",
            4: "hsl(var(--chart-4))",
            5: "hsl(var(--chart-5))",
          },
          bullish: {
            DEFAULT: "hsl(var(--bullish))",
            foreground: "hsl(var(--bullish-foreground))",
          },
          bearish: {
            DEFAULT: "hsl(var(--bearish))",
            foreground: "hsl(var(--bearish-foreground))",
          },
        },
        borderRadius: {
          lg: "var(--radius)",
          md: "calc(var(--radius) - 2px)",
          sm: "calc(var(--radius) - 4px)",
        },
      },
    },
  };
</script>

<!-- Prevent aggressive browser/CDN caching of iframe.html -->
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
<meta http-equiv="Pragma" content="no-cache" />
<meta http-equiv="Expires" content="0" />

<script>
  // Catch chunk loading errors caused by browser caching old HTML/chunks after deployment
  (function() {
    function triggerBustReload(reason) {
      try {
        var now = Date.now();
        var key = 'sb_cache_bust_ts';
        var last = sessionStorage.getItem(key);
        // Debounce: allow max 2 reloads within 10 seconds to avoid infinite loops
        if (last && (now - parseInt(last, 10)) < 4000) {
          return;
        }
        sessionStorage.setItem(key, String(now));

        // Clean stale Storybook manager store to reset any broken state
        try {
          localStorage.removeItem('@storybook/manager/store');
          sessionStorage.removeItem('@storybook/manager/store');
          localStorage.removeItem('live_mockup_timestamp');
        } catch(e) {}

        // Notify parent/top window if in iframe
        try {
          if (window.parent && window.parent !== window) {
            window.parent.postMessage({ type: 'SB_RELOAD_FRESH', reason: String(reason || '') }, '*');
          }
        } catch(e) {}

        // Hard reload top-level window with cache buster query param
        var targetWindow = (window.top && window.top.location) ? window.top : window;
        var currentUrl = new URL(targetWindow.location.href);
        currentUrl.searchParams.set('_sb_bust', String(now));
        targetWindow.location.replace(currentUrl.toString());
      } catch(err) {
        window.location.reload();
      }
    }

    function checkError(msg) {
      if (!msg) return;
      var str = String(msg);
      if (
        str.indexOf('dynamically imported module') !== -1 ||
        str.indexOf('importers[path]') !== -1 ||
        str.indexOf('Failed to fetch') !== -1 ||
        str.indexOf('Loading chunk') !== -1 ||
        str.indexOf('LiveAICanvas.stories') !== -1 ||
        str.indexOf('404') !== -1
      ) {
        triggerBustReload(str);
      }
    }

    // 1. Official Vite dynamic import failure event
    window.addEventListener('vite:preloadError', function(event) {
      if (event && event.preventDefault) event.preventDefault();
      triggerBustReload('vite:preloadError');
    });

    // 2. Global JS error handler
    window.addEventListener('error', function(e) {
      checkError((e && e.message) || (e && e.error && e.error.message) || '');
    });

    // 3. Unhandled promise rejections
    window.addEventListener('unhandledrejection', function(e) {
      var reason = e && e.reason;
      checkError((reason && reason.message) || String(reason || ''));
    });
  })();
</script>
