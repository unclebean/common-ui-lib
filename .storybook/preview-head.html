<script>
  // Catch chunk loading errors caused by browser caching old iframe.html after deployment
  (function() {
    function handleChunkError(msg) {
      if (
        msg.indexOf('dynamically imported module') !== -1 ||
        msg.indexOf('importers[path]') !== -1 ||
        msg.indexOf('Failed to fetch') !== -1 ||
        msg.indexOf('Loading chunk') !== -1
      ) {
        var reloadKey = 'sb_preview_reload_recovery';
        var last = sessionStorage.getItem(reloadKey);
        var now = Date.now();
        if (!last || (now - parseInt(last, 10)) > 10000) {
          sessionStorage.setItem(reloadKey, String(now));
          window.location.reload();
        }
      }
    }

    window.addEventListener('error', function(e) {
      handleChunkError((e && e.message) || '');
    });

    window.addEventListener('unhandledrejection', function(e) {
      var reason = e && e.reason;
      var msg = (reason && reason.message) || String(reason || '');
      handleChunkError(msg);
    });
  })();
</script>
