<!-- Inject Tailwind CSS and Google Fonts into Storybook Manager UI -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    darkMode: 'class',
    theme: {
      extend: {
        fontFamily: {
          sans: ['Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif],
          mono: ['JetBrains Mono', monospace],
        },
      },
    },
  };
</script>
<style>
  /* Custom sleek scrollbars for addon panel */
  ::-webkit-scrollbar {
    width: 6px;
    height: 6px;
  }
  ::-webkit-scrollbar-track {
    background: transparent;
  }
  ::-webkit-scrollbar-thumb {
    background: rgba(148, 163, 184, 0.2);
    border-radius: 9999px;
  }
  ::-webkit-scrollbar-thumb:hover {
    background: rgba(148, 163, 184, 0.4);
  }

  /* Auto-collapse sidebar visually if Storybook persisted state in localStorage */
  body[data-nav-hidden="true"] [data-side="left"],
  body[data-nav-hidden="true"] aside[aria-label="Stories"] {
    display: none !important;
  }
</style>

<script>
  // Safe version-based cache clearing for returning visitors
  (function() {
    try {
      var vKey = 'sb_build_version';
      var currentBuild = '20260907_v2';
      var storedBuild = localStorage.getItem(vKey);
      if (storedBuild !== currentBuild) {
        // Clean obsolete manager store and stale timestamps from previous deployments
        localStorage.removeItem('@storybook/manager/store');
        sessionStorage.removeItem('@storybook/manager/store');
        localStorage.removeItem('live_mockup_timestamp');
        localStorage.setItem(vKey, currentBuild);
      }
    } catch(e) {}
  })();

  // Catch chunk loading errors caused by browser caching old HTML after deployment
  window.addEventListener('error', function(e) {
    var msg = (e && e.message) || '';
    if (
      msg.indexOf('dynamically imported module') !== -1 ||
      msg.indexOf('importers[path]') !== -1 ||
      msg.indexOf('Failed to fetch') !== -1 ||
      msg.indexOf('Loading chunk') !== -1
    ) {
      var reloadKey = 'sb_reload_recovery';
      if (!sessionStorage.getItem(reloadKey)) {
        sessionStorage.setItem(reloadKey, '1');
        window.location.reload();
      }
    }
  });
</script>
