<!-- Inject Tailwind CSS and Google Fonts into Storybook Manager UI -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    darkMode: 'class',
    theme: {
      extend: {
        fontFamily: {
          sans: ['Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif],
          mono: ['JetBrains Mono', monospace],
        },
      },
    },
  };
</script>
<style>
  /* Custom sleek scrollbars for addon panel */
  ::-webkit-scrollbar {
    width: 6px;
    height: 6px;
  }
  ::-webkit-scrollbar-track {
    background: transparent;
  }
  ::-webkit-scrollbar-thumb {
    background: rgba(148, 163, 184, 0.2);
    border-radius: 9999px;
  }
  ::-webkit-scrollbar-thumb:hover {
    background: rgba(148, 163, 184, 0.4);
  }

  /* Auto-collapse sidebar visually if Storybook persisted state in localStorage */
  body[data-nav-hidden="true"] [data-side="left"],
  body[data-nav-hidden="true"] aside[aria-label="Stories"] {
    display: none !important;
  }
</style>

<script>
  // Ensure Storybook 8 sidebar is closed by default across storage
  (function() {
    try {
      var key = '@storybook/manager/store';
      ['localStorage', 'sessionStorage'].forEach(function(type) {
        try {
          var store = window[type];
          if (!store) return;
          var raw = store.getItem(key);
          var parsed = raw ? JSON.parse(raw) : {};
          if (!parsed.layout) parsed.layout = {};
          parsed.layout.navSize = 0;
          parsed.layout.showNav = false;
          parsed.layout.showPanel = true;
          parsed.layout.panelPosition = 'right';
          if (!parsed.layout.recentVisibleSizes) {
            parsed.layout.recentVisibleSizes = { navSize: 280, bottomPanelHeight: 300, rightPanelWidth: 460 };
          }
          store.setItem(key, JSON.stringify(parsed));
        } catch(e) {}
      });
    } catch(e) {}
  })();
</script>
